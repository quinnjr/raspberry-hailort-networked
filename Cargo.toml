[package]
name = "raspberry-haliort-networked"
version = "0.1.0"
edition = "2024"
description = "Distributed HailoRT inference system for Raspberry Pi"

[[bin]]
name = "worker"
path = "src/bin/worker.rs"

[[bin]]
name = "master"
path = "src/bin/master.rs"

[dependencies]
hailort-sys       = { git = "https://github.com/quinnjr/hailort-sys.git" }
tonic             = "0.12"
prost             = "0.13"
tokio             = { version = "1", features = ["full"] }
tokio-stream      = "0.1"
futures           = "0.3"
mdns-sd           = "0.11"
clap              = { version = "4", features = ["derive"] }
anyhow            = "1"
thiserror         = "1"
tracing           = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde             = { version = "1", features = ["derive"] }
serde_json        = "1"
uuid              = { version = "1", features = ["v4"] }
dashmap           = "6"
bytes             = "1"
hostname          = "0.3"

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto       = true
strip     = true
